<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Wallpaper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      transition: background 720s ease-in-out;
    }
    .glow {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.35;
      animation: float 25s ease-in-out infinite; pointer-events: none;
    }
    .glow-1 { width: 450px; height: 450px; top: 15%; left: 25%; animation-delay: 0s; }
    .glow-2 { width: 350px; height: 350px; top: 55%; right: 20%; animation-delay: -8s; }
    .glow-3 { width: 280px; height: 280px; bottom: 20%; left: 40%; animation-delay: -15s; }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(25px, -25px) scale(1.08); }
      50% { transform: translate(-15px, 20px) scale(0.95); }
      75% { transform: translate(20px, 15px) scale(1.05); }
    }
  </style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>
  <script>
    const timePalettes = {
      night: [
        { warm: [45, 30, 78], mid: [30, 20, 60], cool: [20, 15, 45] },
        { warm: [50, 35, 85], mid: [35, 25, 65], cool: [25, 18, 50] },
        { warm: [42, 28, 75], mid: [28, 18, 55], cool: [18, 12, 40] },
        { warm: [48, 32, 80], mid: [32, 22, 62], cool: [22, 16, 48] }
      ],
      dawn: [
        { warm: [180, 100, 140], mid: [140, 80, 160], cool: [100, 60, 120] },
        { warm: [190, 110, 150], mid: [150, 90, 170], cool: [110, 70, 130] },
        { warm: [170, 95, 135], mid: [135, 75, 155], cool: [95, 55, 115] },
        { warm: [185, 105, 145], mid: [145, 85, 165], cool: [105, 65, 125] }
      ],
      morning: [
        { warm: [230, 140, 100], mid: [210, 150, 110], cool: [190, 130, 90] },
        { warm: [240, 150, 110], mid: [220, 160, 120], cool: [200, 140, 100] },
        { warm: [225, 135, 95], mid: [205, 145, 105], cool: [185, 125, 85] },
        { warm: [235, 145, 105], mid: [215, 155, 115], cool: [195, 135, 95] }
      ],
      lateMorning: [
        { warm: [120, 200, 100], mid: [90, 220, 130], cool: [70, 200, 150] },
        { warm: [130, 210, 110], mid: [100, 230, 140], cool: [80, 210, 160] },
        { warm: [115, 195, 95], mid: [85, 215, 125], cool: [65, 195, 145] },
        { warm: [125, 205, 105], mid: [95, 225, 135], cool: [75, 205, 155] }
      ],
      noon: [
        { warm: [80, 220, 180], mid: [70, 200, 210], cool: [60, 180, 220] },
        { warm: [90, 230, 190], mid: [80, 210, 220], cool: [70, 190, 230] },
        { warm: [75, 215, 175], mid: [65, 195, 205], cool: [55, 175, 215] },
        { warm: [85, 225, 185], mid: [75, 205, 215], cool: [65, 185, 225] }
      ],
      afternoon: [
        { warm: [100, 160, 230], mid: [90, 120, 220], cool: [80, 100, 210] },
        { warm: [110, 170, 240], mid: [100, 130, 230], cool: [90, 110, 220] },
        { warm: [95, 155, 225], mid: [85, 115, 215], cool: [75, 95, 205] },
        { warm: [105, 165, 235], mid: [95, 125, 225], cool: [85, 105, 215] }
      ],
      evening: [
        { warm: [180, 80, 160], mid: [160, 60, 140], cool: [140, 50, 120] },
        { warm: [190, 90, 170], mid: [170, 70, 150], cool: [150, 60, 130] },
        { warm: [175, 75, 155], mid: [155, 55, 135], cool: [135, 45, 115] },
        { warm: [185, 85, 165], mid: [165, 65, 145], cool: [145, 55, 125] }
      ],
      dusk: [
        { warm: [120, 50, 100], mid: [90, 40, 80], cool: [70, 30, 60] },
        { warm: [130, 60, 110], mid: [100, 50, 90], cool: [80, 40, 70] },
        { warm: [115, 45, 95], mid: [85, 35, 75], cool: [65, 25, 55] },
        { warm: [125, 55, 105], mid: [95, 45, 85], cool: [75, 35, 65] }
      ],
      lateNight: [
        { warm: [50, 30, 70], mid: [35, 25, 55], cool: [25, 18, 40] },
        { warm: [55, 35, 75], mid: [40, 30, 60], cool: [30, 22, 45] },
        { warm: [45, 25, 65], mid: [30, 20, 50], cool: [20, 15, 35] },
        { warm: [52, 32, 72], mid: [37, 27, 57], cool: [27, 20, 42] }
      ]
    };

    function getTimePeriod(hour) {
      if (hour >= 0 && hour < 5) return 'night';
      if (hour >= 5 && hour < 7) return 'dawn';
      if (hour >= 7 && hour < 9) return 'morning';
      if (hour >= 9 && hour < 11.5) return 'lateMorning';
      if (hour >= 11.5 && hour < 13.5) return 'noon';
      if (hour >= 13.5 && hour < 16) return 'afternoon';
      if (hour >= 16 && hour < 18.5) return 'evening';
      if (hour >= 18.5 && hour < 21) return 'dusk';
      return 'lateNight';
    }

    function generateColorWithVariation(baseColor, variationAmount = 15) {
      const variation = (Math.random() - 0.5) * 2 * variationAmount;
      return Math.max(0, Math.min(255, Math.round(baseColor + variation)));
    }

    function generateGradient() {
      const now = new Date();
      const hour = now.getHours();
      const period = getTimePeriod(hour);
      const palette = timePalettes[period];
      const minuteIndex = Math.floor(now.getMinutes() / 15) % palette.length;
      const baseColors = palette[minuteIndex];
      
      const warm = [
        generateColorWithVariation(baseColors.warm[0]),
        generateColorWithVariation(baseColors.warm[1]),
        generateColorWithVariation(baseColors.warm[2])
      ];
      const mid = [
        generateColorWithVariation(baseColors.mid[0]),
        generateColorWithVariation(baseColors.mid[1]),
        generateColorWithVariation(baseColors.mid[2])
      ];
      const cool = [
        generateColorWithVariation(baseColors.cool[0]),
        generateColorWithVariation(baseColors.cool[1]),
        generateColorWithVariation(baseColors.cool[2])
      ];
      
      const gradient = `linear-gradient(135deg, rgb(${warm.join(',')}) 0%, rgb(${cool.join(',')}) 100%)`;
      window.__currentWallpaperColors = { warm, mid, cool };
      return gradient;
    }

    function updateBackground() {
      const gradient = generateGradient();
      document.body.style.background = gradient;
      updateGlowColors();
    }

    function updateGlowColors() {
      const colors = window.__currentWallpaperColors;
      if (!colors) return;
      const glows = document.querySelectorAll('.glow');
      const colorSets = [colors.warm, colors.mid, colors.cool];
      glows.forEach((glow, index) => {
        const rgb = colorSets[index % colorSets.length];
        glow.style.background = `radial-gradient(circle, rgba(${rgb[0]},${rgb[1]},${rgb[2]},0.25) 0%, transparent 70%)`;
      });
    }

    // Android 动态取色接口
    function getCurrentColors() {
      const colors = window.__currentWallpaperColors;
      if (!colors) {
        return { warm: [102, 126, 234], mid: [118, 75, 162], cool: [102, 126, 234] };
      }
      return { warm: colors.warm, mid: colors.mid, cool: colors.cool };
    }

    updateBackground();
    setInterval(updateBackground, 900000);

    window.setWallpaperConfig = function(config) {
      console.log('Wallpaper config updated:', config);
    };
  </script>
</body>
</html>
