<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warm Fluid Wallpaper</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-a: #180d2e;
      --bg-b: #3b1f58;
      --bg-c: #ffb7a5;
      --bg-d: #ff8e7b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 24% 26%, rgba(255, 186, 163, 0.95), rgba(255, 186, 163, 0) 40%),
        linear-gradient(135deg, var(--bg-c) 0%, #ef9ea0 34%, #7d67b0 68%, #09133d 100%);
    }

    body {
      position: relative;
      isolation: isolate;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #fluid {
      filter: saturate(1.06) contrast(1);
    }

    #grain {
      mix-blend-mode: soft-light;
      opacity: 0.08;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="fluid"></canvas>
  <canvas id="grain"></canvas>

  <script>
    (() => {
      const fluidCanvas = document.getElementById("fluid");
      const grainCanvas = document.getElementById("grain");
      const baseCanvas = document.createElement("canvas");
      const warpCanvas = document.createElement("canvas");
      const smudgeCanvas = document.createElement("canvas");
      const ctx = fluidCanvas.getContext("2d", { alpha: false });
      const grainCtx = grainCanvas.getContext("2d", { alpha: true });
      const baseCtx = baseCanvas.getContext("2d", { alpha: false });
      const warpCtx = warpCanvas.getContext("2d", { alpha: false });
      const smudgeCtx = smudgeCanvas.getContext("2d", { alpha: true });

      const TAU = Math.PI * 2;
      const state = {
        width: 0,
        height: 0,
        dpr: 1,
        time: 0,
        blobs: [],
        veils: [],
        shadows: [],
        flows: []
      };

      const warmPalette = [
        [255, 198, 170],
        [255, 172, 145],
        [255, 144, 126],
        [244, 126, 124],
        [231, 151, 176],
        [218, 162, 210]
      ];

      const shadowPalette = [
        [67, 44, 121],
        [36, 33, 98],
        [13, 20, 62],
        [10, 14, 42]
      ];

      const lerp = (a, b, t) => a + (b - a) * t;
      const fract = (value) => value - Math.floor(value);
      const rand = (min, max) => lerp(min, max, Math.random());
      const pick = (list) => list[Math.floor(Math.random() * list.length)];

      function hash(value) {
        return fract(Math.sin(value * 127.1 + 311.7) * 43758.5453123);
      }

      function noise1D(value) {
        const i = Math.floor(value);
        const f = value - i;
        const u = f * f * (3 - 2 * f);
        return lerp(hash(i), hash(i + 1), u);
      }

      function fbm(value) {
        let amplitude = 0.5;
        let frequency = 1;
        let sum = 0;
        let weight = 0;

        for (let i = 0; i < 4; i += 1) {
          sum += noise1D(value * frequency) * amplitude;
          weight += amplitude;
          frequency *= 2.03;
          amplitude *= 0.5;
        }

        return sum / weight;
      }

      function rgba(color, alpha) {
        return `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${alpha})`;
      }

      function createBlob(type) {
        const isShadow = type === "shadow";
        const palette = isShadow ? shadowPalette : warmPalette;
        return {
          color: pick(palette),
          anchorX: rand(-0.1, 1.1),
          anchorY: rand(-0.05, 1.05),
          radiusX: rand(0.22, 0.62),
          radiusY: rand(0.16, 0.48),
          stretch: rand(0.8, 1.45),
          amplitudeX: rand(0.02, isShadow ? 0.05 : 0.04),
          amplitudeY: rand(0.018, isShadow ? 0.055 : 0.038),
          rotationBase: rand(-1.1, 1.1),
          rotationAmp: rand(0.03, 0.12),
          speed: rand(0.012, 0.038),
          driftSpeed: rand(0.018, 0.042),
          driftPhaseX: rand(0, TAU),
          driftPhaseY: rand(0, TAU),
          driftRangeX: rand(isShadow ? 0.03 : 0.025, isShadow ? 0.075 : 0.06),
          driftRangeY: rand(isShadow ? 0.02 : 0.018, isShadow ? 0.06 : 0.048),
          seed: rand(0, 999),
          alpha: isShadow ? rand(0.22, 0.46) : rand(0.15, 0.3),
          blur: rand(isShadow ? 18 : 24, isShadow ? 34 : 56),
          mode: isShadow ? "multiply" : "screen"
        };
      }

      function createVeil() {
        return {
          color: Math.random() > 0.28 ? pick(warmPalette) : pick(shadowPalette),
          anchorX: rand(-0.12, 1.08),
          anchorY: rand(0.1, 0.92),
          radiusX: rand(0.42, 0.9),
          radiusY: rand(0.08, 0.18),
          stretch: rand(0.7, 1.15),
          amplitudeX: rand(0.01, 0.025),
          amplitudeY: rand(0.01, 0.03),
          rotationBase: rand(-1.15, 1.15),
          rotationAmp: rand(0.04, 0.12),
          speed: rand(0.008, 0.02),
          driftSpeed: rand(0.012, 0.028),
          driftPhaseX: rand(0, TAU),
          driftPhaseY: rand(0, TAU),
          driftRangeX: rand(0.03, 0.07),
          driftRangeY: rand(0.02, 0.05),
          seed: rand(0, 999),
          alpha: rand(0.08, 0.16),
          blur: rand(34, 72),
          mode: Math.random() > 0.45 ? "screen" : "soft-light"
        };
      }

      function createFlow() {
        return {
          anchorX: rand(0.12, 0.88),
          anchorY: rand(0.08, 0.92),
          radiusX: rand(0.16, 0.32),
          radiusY: rand(0.1, 0.22),
          stretch: rand(0.9, 1.35),
          speed: rand(0.007, 0.018),
          driftSpeed: rand(0.008, 0.02),
          driftPhaseX: rand(0, TAU),
          driftPhaseY: rand(0, TAU),
          driftRangeX: rand(0.03, 0.09),
          driftRangeY: rand(0.025, 0.07),
          shiftSpeed: rand(0.01, 0.026),
          shiftPhaseX: rand(0, TAU),
          shiftPhaseY: rand(0, TAU),
          shiftRangeX: rand(12, 26),
          shiftRangeY: rand(8, 18),
          rotationBase: rand(-1.2, 1.2),
          rotationAmp: rand(0.03, 0.09),
          alpha: rand(0.12, 0.22),
          blur: rand(18, 34)
        };
      }

      function rebuildScene() {
        state.blobs = Array.from({ length: 7 }, () => createBlob("warm"));
        state.veils = Array.from({ length: 4 }, () => createVeil());
        state.shadows = Array.from({ length: 3 }, () => createBlob("shadow"));
        state.flows = Array.from({ length: 4 }, () => createFlow());
      }

      function resize() {
        state.dpr = Math.min(window.devicePixelRatio || 1, 2);
        state.width = window.innerWidth;
        state.height = window.innerHeight;

        for (const canvas of [fluidCanvas, grainCanvas]) {
          canvas.width = Math.round(state.width * state.dpr);
          canvas.height = Math.round(state.height * state.dpr);
          canvas.style.width = `${state.width}px`;
          canvas.style.height = `${state.height}px`;
        }

        for (const canvas of [baseCanvas, warpCanvas, smudgeCanvas]) {
          canvas.width = Math.round(state.width * state.dpr);
          canvas.height = Math.round(state.height * state.dpr);
        }

        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
        grainCtx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
        baseCtx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
        warpCtx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
        smudgeCtx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
        rebuildScene();
        drawGrain();
      }

      function drawBackground(targetCtx, time) {
        const gradient = targetCtx.createLinearGradient(0, 0, state.width, state.height);
        gradient.addColorStop(0, "#ffb8a4");
        gradient.addColorStop(0.28, "#f8a4a0");
        gradient.addColorStop(0.58, "#866bb8");
        gradient.addColorStop(1, "#07123a");
        targetCtx.globalCompositeOperation = "source-over";
        targetCtx.globalAlpha = 1;
        targetCtx.fillStyle = gradient;
        targetCtx.fillRect(0, 0, state.width, state.height);

        const glowX = state.width * (0.24 + (fbm(time * 0.008 + 6.1) - 0.5) * 0.05);
        const glowY = state.height * (0.22 + (fbm(time * 0.007 + 17.4) - 0.5) * 0.04);
        const glow = targetCtx.createRadialGradient(
          glowX,
          glowY,
          0,
          glowX,
          glowY,
          Math.max(state.width, state.height) * 0.7
        );
        glow.addColorStop(0, "rgba(255, 220, 196, 0.94)");
        glow.addColorStop(0.28, "rgba(255, 190, 162, 0.48)");
        glow.addColorStop(0.72, "rgba(255, 171, 146, 0)");
        targetCtx.fillStyle = glow;
        targetCtx.fillRect(0, 0, state.width, state.height);

        const depth = targetCtx.createLinearGradient(state.width * 0.45, state.height * 0.2, state.width, state.height);
        depth.addColorStop(0, "rgba(32, 20, 74, 0)");
        depth.addColorStop(0.55, "rgba(22, 19, 75, 0.2)");
        depth.addColorStop(1, "rgba(8, 14, 48, 0.44)");
        targetCtx.fillStyle = depth;
        targetCtx.fillRect(0, 0, state.width, state.height);
      }

      function drawEllipseGradient(targetCtx, layer, softness = 1) {
        const t = state.time;
        const nx = fbm(t * layer.speed + layer.seed);
        const ny = fbm(t * layer.speed + layer.seed + 19.7);
        const nr = fbm(t * layer.speed * 0.5 + layer.seed + 41.2);
        const nsx = fbm(t * layer.speed * 0.7 + layer.seed + 63.4);
        const nsy = fbm(t * layer.speed * 0.78 + layer.seed + 85.9);
        const driftX =
          Math.sin(t * layer.driftSpeed + layer.driftPhaseX) * layer.driftRangeX +
          (fbm(t * layer.driftSpeed * 0.42 + layer.seed + 133.7) - 0.5) * layer.driftRangeX * 0.5;
        const driftY =
          Math.cos(t * layer.driftSpeed * 0.92 + layer.driftPhaseY) * layer.driftRangeY +
          (fbm(t * layer.driftSpeed * 0.38 + layer.seed + 167.2) - 0.5) * layer.driftRangeY * 0.45;
        const px = state.width * (layer.anchorX + driftX + (nx - 0.5) * layer.amplitudeX * softness);
        const py = state.height * (layer.anchorY + driftY + (ny - 0.5) * layer.amplitudeY * softness);
        const rx = state.width * layer.radiusX * (0.95 + (nsx - 0.5) * 0.12);
        const ry = state.height * layer.radiusY * (layer.stretch || 1) * (0.95 + (nsy - 0.5) * 0.14);
        const rotation = layer.rotationBase + (nr - 0.5) * layer.rotationAmp;

        targetCtx.save();
        targetCtx.translate(px, py);
        targetCtx.rotate(rotation);
        targetCtx.scale(1, ry / rx);
        targetCtx.globalCompositeOperation = layer.mode;
        targetCtx.globalAlpha = 1;
        targetCtx.filter = `blur(${layer.blur}px)`;

        const gradient = targetCtx.createRadialGradient(0, 0, 0, 0, 0, rx);
        if (layer.mode === "multiply") {
          gradient.addColorStop(0, rgba(layer.color, layer.alpha * 1.15));
          gradient.addColorStop(0.24, rgba(layer.color, layer.alpha * 0.98));
          gradient.addColorStop(0.56, rgba(layer.color, layer.alpha * 0.58));
          gradient.addColorStop(0.84, rgba(layer.color, layer.alpha * 0.16));
          gradient.addColorStop(1, rgba(layer.color, 0));
        } else {
          gradient.addColorStop(0, rgba(layer.color, layer.alpha * 1.22));
          gradient.addColorStop(0.22, rgba(layer.color, layer.alpha));
          gradient.addColorStop(0.54, rgba(layer.color, layer.alpha * 0.56));
          gradient.addColorStop(0.86, rgba(layer.color, layer.alpha * 0.12));
          gradient.addColorStop(1, rgba(layer.color, 0));
        }

        targetCtx.fillStyle = gradient;
        targetCtx.beginPath();
        targetCtx.arc(0, 0, rx, 0, TAU);
        targetCtx.fill();
        targetCtx.filter = "none";
        targetCtx.restore();
      }

      function drawFlowWash(targetCtx, time) {
        const softWave = targetCtx.createLinearGradient(
          state.width * 0.08,
          state.height * (0.08 + (fbm(time * 0.007 + 22.7) - 0.5) * 0.02),
          state.width * 0.82,
          state.height * (0.72 + (fbm(time * 0.006 + 31.2) - 0.5) * 0.02)
        );
        softWave.addColorStop(0, "rgba(255, 215, 194, 0.18)");
        softWave.addColorStop(0.48, "rgba(252, 154, 144, 0.06)");
        softWave.addColorStop(1, "rgba(7, 19, 58, 0)");
        targetCtx.globalCompositeOperation = "screen";
        targetCtx.fillStyle = softWave;
        targetCtx.fillRect(0, 0, state.width, state.height);

        const lowShade = targetCtx.createLinearGradient(0, state.height * 0.58, state.width, state.height);
        lowShade.addColorStop(0, "rgba(61, 44, 132, 0.1)");
        lowShade.addColorStop(0.5, "rgba(17, 24, 77, 0.08)");
        lowShade.addColorStop(1, "rgba(7, 12, 38, 0.24)");
        targetCtx.globalCompositeOperation = "multiply";
        targetCtx.fillStyle = lowShade;
        targetCtx.fillRect(0, 0, state.width, state.height);
      }

      function renderBaseScene() {
        drawBackground(baseCtx, state.time);

        for (const veil of state.veils) {
          drawEllipseGradient(baseCtx, veil, 1.2);
        }

        for (const blob of state.blobs) {
          drawEllipseGradient(baseCtx, blob, 1);
        }

        for (const shadow of state.shadows) {
          drawEllipseGradient(baseCtx, shadow, 1.08);
        }

        drawFlowWash(baseCtx, state.time);
      }

      function warpScene(time) {
        warpCtx.clearRect(0, 0, state.width, state.height);
        warpCtx.globalCompositeOperation = "source-over";
        warpCtx.globalAlpha = 1;
        warpCtx.drawImage(baseCanvas, 0, 0, state.width, state.height);

        for (const flow of state.flows) {
          const driftX =
            Math.sin(time * flow.driftSpeed + flow.driftPhaseX) * flow.driftRangeX +
            (fbm(time * flow.speed + flow.anchorX * 9.7) - 0.5) * flow.driftRangeX * 0.45;
          const driftY =
            Math.cos(time * flow.driftSpeed * 0.92 + flow.driftPhaseY) * flow.driftRangeY +
            (fbm(time * flow.speed + flow.anchorY * 11.3) - 0.5) * flow.driftRangeY * 0.45;
          const centerX = state.width * (flow.anchorX + driftX);
          const centerY = state.height * (flow.anchorY + driftY);
          const shiftX =
            Math.sin(time * flow.shiftSpeed + flow.shiftPhaseX) * flow.shiftRangeX +
            (fbm(time * flow.shiftSpeed * 0.72 + flow.anchorX * 13.1) - 0.5) * flow.shiftRangeX * 0.35;
          const shiftY =
            Math.cos(time * flow.shiftSpeed * 0.84 + flow.shiftPhaseY) * flow.shiftRangeY +
            (fbm(time * flow.shiftSpeed * 0.68 + flow.anchorY * 7.9) - 0.5) * flow.shiftRangeY * 0.3;
          const rx = state.width * flow.radiusX;
          const ry = state.height * flow.radiusY * flow.stretch;
          const rotation = flow.rotationBase + Math.sin(time * flow.speed + flow.anchorX * 5.1) * flow.rotationAmp;

          smudgeCtx.clearRect(0, 0, state.width, state.height);
          smudgeCtx.globalCompositeOperation = "source-over";
          smudgeCtx.globalAlpha = 1;
          smudgeCtx.drawImage(baseCanvas, shiftX, shiftY, state.width, state.height);
          smudgeCtx.save();
          smudgeCtx.globalCompositeOperation = "destination-in";
          smudgeCtx.translate(centerX, centerY);
          smudgeCtx.rotate(rotation);
          smudgeCtx.scale(1, ry / rx);

          const mask = smudgeCtx.createRadialGradient(0, 0, 0, 0, 0, rx);
          mask.addColorStop(0, "rgba(255, 255, 255, 0.82)");
          mask.addColorStop(0.42, "rgba(255, 255, 255, 0.46)");
          mask.addColorStop(0.78, "rgba(255, 255, 255, 0.16)");
          mask.addColorStop(1, "rgba(255, 255, 255, 0)");
          smudgeCtx.fillStyle = mask;
          smudgeCtx.beginPath();
          smudgeCtx.arc(0, 0, rx, 0, TAU);
          smudgeCtx.fill();
          smudgeCtx.restore();

          warpCtx.globalCompositeOperation = "source-over";
          warpCtx.globalAlpha = flow.alpha;
          warpCtx.filter = `blur(${flow.blur}px)`;
          warpCtx.drawImage(smudgeCanvas, 0, 0, state.width, state.height);
          warpCtx.filter = "none";
        }

        ctx.clearRect(0, 0, state.width, state.height);
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = 1;
        ctx.drawImage(warpCanvas, 0, 0, state.width, state.height);

        const driftX = Math.sin(time * 0.045) * 6;
        const driftY = Math.cos(time * 0.038) * 4;
        ctx.globalCompositeOperation = "screen";
        ctx.globalAlpha = 0.16;
        ctx.filter = "blur(26px)";
        ctx.drawImage(baseCanvas, driftX, driftY, state.width, state.height);
        ctx.filter = "none";

        const bloom = ctx.createLinearGradient(0, state.height * 0.04, state.width, state.height * 0.72);
        bloom.addColorStop(0, "rgba(255, 223, 204, 0.1)");
        bloom.addColorStop(0.45, "rgba(255, 170, 154, 0.05)");
        bloom.addColorStop(1, "rgba(255, 170, 154, 0)");
        ctx.globalCompositeOperation = "screen";
        ctx.globalAlpha = 1;
        ctx.fillStyle = bloom;
        ctx.fillRect(0, 0, state.width, state.height);
      }

      function drawGrain() {
        grainCtx.setTransform(1, 0, 0, 1, 0, 0);
        grainCtx.clearRect(0, 0, grainCanvas.width, grainCanvas.height);
        const image = grainCtx.createImageData(grainCanvas.width, grainCanvas.height);
        const { data } = image;

        for (let i = 0; i < data.length; i += 4) {
          const tone = Math.floor(rand(108, 180));
          const drift = Math.floor(rand(-12, 12));
          data[i] = tone + 12;
          data[i + 1] = tone + drift;
          data[i + 2] = tone - 10;
          data[i + 3] = Math.floor(rand(6, 24));
        }

        grainCtx.putImageData(image, 0, 0);
        grainCtx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      }

      function frame(now) {
        state.time = now * 0.001;
        renderBaseScene();
        warpScene(state.time);

        const driftX = Math.sin(state.time * 0.025) * 10;
        const driftY = Math.cos(state.time * 0.021) * 8;
        grainCanvas.style.transform = `translate(${driftX}px, ${driftY}px) scale(1.03)`;

        requestAnimationFrame(frame);
      }

      resize();
      window.addEventListener("resize", resize, { passive: true });
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
